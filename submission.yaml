submission:
  title: "IBM Bob Supply Chain Assistant — Autonomous Risk Mitigation & Cold Chain Control Tower"

  problem_statement: >
    Global supply chains face sudden severe disruptions like geopolitical conflicts, port strikes, road closures, and extreme weather, leaving hundreds of shipments delayed while idle fleet assets remain unutilized. Furthermore, cold-chain temperature breaches are often discovered only after delivery, resulting in catastrophic pharmaceutical and food cargo losses.

  solution_summary: >
    We built IBM Bob Supply Chain Assistant, an autonomous AI-powered control tower that monitors real-time logistics telemetry, detects disruption events, recommends multi-modal alternate routes and carriers in Indian Rupees (₹), redeploys idle fleet assets, and computes WHO/FDA thermal excursion compliance via IoT sensor streams.

  key_features:
    - "Real-Time Disruption Impact Radar mapping affected shipments and cargo value at risk (₹ INR)"
    - "Dynamic Multi-Modal Re-Routing Engine evaluating cost, ETA, reliability, and bottleneck bypasses"
    - "Autonomous Fleet Asset Rebalancing identifying idle trucks/reefers and generating ROI plans"
    - "IoT Cold-Chain Thermal Excursion Safeguard with USP <1150>/WHO MKT calculation"
    - "IBM Bob Autonomous Copilot with zero-shot mitigation execution buttons in chat"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["In-Memory Pydantic Engine"]
    other: ["Uvicorn", "Pydantic", "Lucide-React", "Python-Dotenv"]

  what_we_are_most_proud_of: >
    End-to-end autonomous agent workflow where Bob Copilot presents actionable mitigation buttons that instantly execute re-routes and fleet redeployments across the live control tower dashboard, paired with WHO/FDA MKT thermal compliance calculations and localized ₹ INR financial modeling.

  known_limitations: >
    IoT sensor feeds use realistic 24-hour simulated time-series data for demonstration stability. User authentication is open for streamlined hackathon evaluation.

